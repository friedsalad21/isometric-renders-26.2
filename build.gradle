plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.wispforest.io/releases/" }
    maven { url "https://jitpack.io" }
    exclusiveContent {
        forRepository { maven { url "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/isometricrenders.accesswidener")

    // Dev and test runs: enough memory for big area renders and shader packs
    runs.configureEach {
        vmArg "-Xmx8G"

        // gizmolib isn't published anywhere, -PgizmolibJar=<path> loads a local jar as an extra mod
        if (project.hasProperty("gizmolibJar")) {
            vmArg "-Dfabric.addMods=${project.property("gizmolibJar")}"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "io.wispforest:owo-lib:${project.owo_version}"
    include "io.wispforest:owo-sentinel:${project.owo_version}"

    // Optional: Scarpet shapes show up in area renders when Carpet is installed
    compileOnly "maven.modrinth:carpet:${project.carpet_version}"
    localRuntime "maven.modrinth:carpet:${project.carpet_version}"

    // Iris API to keep renders working with shader packs; Iris + Sodium only run in dev with -PwithShaders
    compileOnly "maven.modrinth:iris:${project.iris_version}"
    if (project.hasProperty("withShaders")) {
        localRuntime "maven.modrinth:iris:${project.iris_version}"
        localRuntime "maven.modrinth:sodium:${project.sodium_version}"
    }

    // Litematica (+ malilib) in dev runs with -PwithLitematica, for pasting test builds from schematics
    if (project.hasProperty("withLitematica")) {
        localRuntime "maven.modrinth:litematica:${project.litematica_version}"
        localRuntime "maven.modrinth:malilib:${project.malilib_version}"
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs += ['-Xmaxerrs', '2000']
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    // Short download name: IsometricRenders-<version>.jar (this repo only targets 26.2)
    archiveFileName = "IsometricRenders-${project.mod_version.tokenize('+')[0]}.jar"
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "isometric-renders-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

